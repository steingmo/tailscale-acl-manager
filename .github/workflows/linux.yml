name: Linux engine

# The policy engine, the command-line tool, and the web service, without the
# Mac app (everything in a Mac/ folder is left out — see Package.swift).
on:
  push:
    branches: [main, web-ui]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Diagnose (temporary)
        run: |
          swift build --build-tests
          for t in testConfigProblems testSecretsComeFromFilesAndLooseOnesAreNoticed testIDTokenChecks testRolesAndReturnPath testSessionsExpireAndStatesWorkOnce testSigningInAndTheAPI testTheWebInterface testWhoIsKeptOut testMicrosoftRefusingOrTheTailnetBeingDown testDevelopmentLoginOnlyWhenAskedFor testServeCommandChecksTheConfig; do
            echo "=== $t"
            timeout 60 swift test --skip-build --filter "WebServerTests/$t" 2>&1 | grep -E "error|passed|failed|Executed" | head -8 || true
            echo "=== $t exit ${PIPESTATUS[0]}"
          done
      - name: Lint a policy with the command-line tool
        run: |
          printf '{"groups": {"group:eng": ["a@example.com"]}, "grants": [{"src": ["group:eng"], "dst": ["*"], "ip": ["tcp:443"]}]}' > /tmp/policy.hujson
          swift run TailscaleACL lint /tmp/policy.hujson

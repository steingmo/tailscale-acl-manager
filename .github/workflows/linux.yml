name: Linux engine

# The policy engine, the command-line tool, and the web service, without the
# Mac app (everything in a Mac/ folder is left out — see Package.swift).
on:
  push:
    branches: [main, web-ui]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Diagnose (temporary)
        shell: bash
        run: |
          swift build --build-tests
          echo "=== server suite alone"
          timeout 120 stdbuf -oL -eL swift test --skip-build --filter WebServerTests 2>&1 | grep -E "Test Case|error|Executed|Fatal|signal" | tail -30 || true
          echo "=== full suite"
          timeout 300 stdbuf -oL -eL swift test --skip-build 2>&1 | grep -E "Test Case .*WebServer|Test Suite 'WebServer|error|Executed [0-9]{3}|Fatal|signal" | tail -30 || true
          echo "=== done"
      - name: Lint a policy with the command-line tool
        run: |
          printf '{"groups": {"group:eng": ["a@example.com"]}, "grants": [{"src": ["group:eng"], "dst": ["*"], "ip": ["tcp:443"]}]}' > /tmp/policy.hujson
          swift run TailscaleACL lint /tmp/policy.hujson

name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run tests
        run: swift test
      # Again optimized, like the shipped app: the optimizer can break builds
      # (a Swift 6.4 crash) and behavior (1.26.0's launch crash) that debug hides.
      - name: Release tests
        run: swift test -c release -Xswiftc -enable-testing

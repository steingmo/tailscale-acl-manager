name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tests
        run: swift test
      # Again optimized, like the shipped app: the optimizer can break builds
      # (a Swift 6.4 crash) and behavior (1.26.0's launch crash) that debug hides.
      - name: Release tests
        run: swift test -c release -Xswiftc -enable-testing

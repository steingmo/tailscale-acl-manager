name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Run tests
        run: swift test
      # Release builds run the optimizer, which can fail where debug builds
      # don't (a Swift 6.4 crash only surfaced in release.sh).
      - name: Release build
        run: swift build -c release
